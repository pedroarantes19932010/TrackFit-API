name: Android de teste com Firebase
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configurar cliente Firebase
        env:
          CLIENT_CONFIG: ${{ secrets.FIREBASE_ANDROID_CLIENT_JSON }}
        run: |
          test -n "$CLIENT_CONFIG"
          printf '%s' "$CLIENT_CONFIG" > android/app/google-services.json
      - run: gradle -p android :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: trackfit-push-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
