name: Android piloto
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/ui/**'
      - '.github/workflows/android-pilot.yml'
permissions:
  contents: read
concurrency:
  group: android-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android :app:assembleDebug --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/trackfit-ui" --no-save --ignore-scripts playwright@1.56.1
      - name: Enable KVM for the virtual device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: ${{ runner.temp }}/trackfit-ui/node_modules
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash tests/ui/run-emulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrackFit-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
