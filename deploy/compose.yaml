services:
  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
      - ./secrets:/run/trackfit-secrets:ro
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TRACKFIT_DOMAIN: ${TRACKFIT_DOMAIN:?Defina o domínio em deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  data:
  certificates:
